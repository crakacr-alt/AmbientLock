name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: false

      - name: Install integration dependency
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "These files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Tests with race detector
        run: go test -race ./...

      - name: Build CLI
        run: go build -o bin/ambient ./cmd/ambient

      - name: Smoke test CLI
        run: ./bin/ambient version
