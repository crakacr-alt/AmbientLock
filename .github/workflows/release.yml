name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Test before release
        run: go test ./...

      - name: Build Linux binaries
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/ambient-linux-amd64 ./cmd/ambient
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/ambient-linux-arm64 ./cmd/ambient
          cd dist
          sha256sum ambient-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ambient-linux-amd64
            dist/ambient-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
