name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: false

      - name: Verify tag matches source version
        shell: bash
        run: |
          expected="v$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' internal/app/app.go)"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "tag $GITHUB_REF_NAME does not match source version $expected"
            exit 1
          }

      - name: Verify release candidate
        run: |
          go vet ./...
          go test -race ./...
          go build ./cmd/ambient

      - name: Build Linux binaries
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/ambient-linux-amd64 ./cmd/ambient
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/ambient-linux-arm64 ./cmd/ambient
          cd dist
          sha256sum ambient-* > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "AmbientLock $GITHUB_REF_NAME"
